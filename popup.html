<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Oil 路线助手</title>
  <link rel="stylesheet" href="popup.css">
  <script src="vendor/xlsx.full.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
        <span class="brand-title">Green Oil 路线助手</span>
      </div>
      <div class="header-actions">
        <button id="btnSyncCloud" class="icon-btn" title="同步云端 (Cloudflare KV)">
          <svg viewBox="0 0 24 24">
            <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
          </svg>
        </button>
        <button id="btnOpenAuth" class="icon-btn" title="账号与登录状态">
          <svg viewBox="0 0 24 24">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
          <span id="authDot" class="auth-dot"></span>
        </button>
      </div>
    </header>

    <!-- Route Selector & Management -->
    <section class="route-toolbar">
      <div class="route-selector-row">
        <label for="routeSelect" class="route-label">当前路线：</label>
        <div class="select-wrapper">
          <select id="routeSelect"></select>
        </div>
      </div>
      <div class="route-btn-group">
        <button id="btnNewRoute" class="btn-subtle" title="新建路线分组">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          新建
        </button>
        <button id="btnRenameRoute" class="btn-subtle" title="重命名当前路线">
          <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
          重命名
        </button>
        <button id="btnDeleteRoute" class="btn-subtle btn-danger-subtle" title="删除当前路线">
          <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
          删除
        </button>
      </div>
    </section>

    <!-- Origin Address -->
    <section class="origin-section">
      <div class="origin-header">
        <span class="origin-label">出发点 (Origin)</span>
        <button id="btnResetOrigin" class="btn-link" title="恢复默认出发点">恢复默认</button>
      </div>
      <div class="origin-input-row">
        <svg class="origin-icon" viewBox="0 0 24 24">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
        <input type="text" id="inputOrigin" class="origin-input" placeholder="输入出发点地址">
      </div>
    </section>

    <!-- Waypoints List Header -->
    <div class="list-summary-bar">
      <span class="summary-title">经停途径点 (Stops)</span>
      <span id="badgeCount" class="badge-count">0 站</span>
    </div>

    <!-- Waypoints List Container -->
    <main id="waypointsList" class="waypoints-list">
      <!-- Dynamically Rendered -->
    </main>

    <!-- Bottom Actions Toolbar -->
    <footer class="bottom-actions">
      <button id="btnGenerateNav" class="btn btn-primary" title="在 Google Maps 打开多点导航路线">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
        </svg>
        生成导航链接
      </button>
      <button id="btnExportExcel" class="btn btn-secondary" title="导出标准英文 Excel 表格 (无电话)">
        <svg viewBox="0 0 24 24">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
        </svg>
        导出 Excel
      </button>
      <button id="btnClearRoute" class="btn btn-outline-danger" title="清空当前路线所有途径点">
        <svg viewBox="0 0 24 24">
          <path d="M15 16h4v2h-4zm0-8h7v2h-7zm0 4h6v2h-6zM3 18c0 1.1.9 2 2 2h6c1.1 0 2-.9 2-2V8H3v10zM14 5h-3l-1-1H6L5 5H2v2h12z"/>
        </svg>
        清空
      </button>
    </footer>

    <!-- Navigation Legs Modal (for >9 stops) -->
    <div id="navModal" class="modal-overlay" style="display: none;">
      <div class="modal-card">
        <div class="modal-header">
          <h3 class="modal-title">官方分段导航</h3>
          <button id="btnCloseNavModal" class="icon-btn">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <p class="modal-desc">Google 地图单次导航最多支持 9 个经停点，系统已自动按最优顺序分段：</p>
          <div id="navLegsList" class="nav-legs-list"></div>
        </div>
        <div class="modal-footer">
          <button id="btnOpenAllLegs" class="btn btn-primary full-width">在新标签页中打开所有分段</button>
        </div>
      </div>
    </div>

    <!-- Auth & Sync Modal -->
    <div id="authModal" class="modal-overlay" style="display: none;">
      <div class="modal-card">
        <div class="modal-header">
          <h3 class="modal-title">Green Oil 账号认证</h3>
          <button id="btnCloseAuthModal" class="icon-btn">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <div id="authLoggedView" style="display: none;">
            <div class="auth-status-box">
              <span class="auth-status-title">已连接云端</span>
              <span id="authUsernameDisplay" class="auth-username"></span>
              <span id="authSyncTimeDisplay" class="auth-sync-time"></span>
            </div>
            <div class="modal-btn-row">
              <button id="btnManualSync" class="btn btn-primary">立即双向同步</button>
              <button id="btnLogout" class="btn btn-outline-danger">退出登录</button>
            </div>
          </div>
          <div id="authLoginForm">
            <p class="modal-desc">登录 Green Oil 账号可将多路线途径点实时同步至 Cloudflare Worker 云端：</p>
            <div class="form-group">
              <label for="inputUsername">用户名</label>
              <input type="text" id="inputUsername" class="form-input" placeholder="输入用户名">
            </div>
            <div class="form-group">
              <label for="inputPassword">密码</label>
              <input type="password" id="inputPassword" class="form-input" placeholder="输入密码">
            </div>
            <div id="authErrorMsg" class="form-error" style="display: none;"></div>
            <button id="btnLogin" class="btn btn-primary full-width">登录并连接云端</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
